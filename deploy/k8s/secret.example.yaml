#: 演示钥匙的占位。真交付时不要提交真实凭据：用
#:   kubectl -n driver-platform create secret generic driver-platform-keys \
#:     --from-literal=api-keys='admin-key:plugin_admin,read-key:search_database|echo'
#: 覆盖它，或者用外部密钥管理（SealedSecrets / External Secrets）。
apiVersion: v1
kind: Secret
metadata:
  name: driver-platform-keys
  namespace: driver-platform
type: Opaque
stringData:
  api-keys: "admin-key:plugin_admin,read-key:search_database|echo"
