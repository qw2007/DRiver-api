# 阶段 8：多副本前置网关（nginx 挂进 /etc/nginx/conf.d/default.conf）。
#
# 为什么需要它：Compose 的 `--scale` 会让多个 driver-platform 容器共享同一个服务名，
# 但**没有**任何东西在这几个容器前面分发请求（平台自己不发布宿主端口了，见 docker-compose.scale.yml）。
# nginx 在这里只做三件事：解析服务名、转发、失败换一个副本重试。
#
# 两个关键点都不是装饰：
#   1. `resolver 127.0.0.11` 是 Docker 的内嵌 DNS。静态 upstream（`server driver-platform:8000;`）
#      只在启动时解析一次，副本换 IP 后就一直往旧地址打；变量形式的 `proxy_pass` 才会每次请求走 resolver。
#   2. `valid=5s` 是有意留的短缓存：滚动替换时副本会消失，缓存越短越少打到死地址；
#      但无论如何都有窗口，所以还要靠 `proxy_next_upstream` 兜底——这才是「滚动更新不中断」的机制。

resolver 127.0.0.11 valid=5s ipv6=off;
resolver_timeout 2s;

server {
    listen 80;
    server_name _;

    # 访问日志走容器 stdout（镜像默认 nginx.conf 已把 access_log 指向 stdout 软链）。
    location / {
        set $backend "driver-platform";
        proxy_pass http://$backend:8000;

        # 1.1 + 清空 Connection：到上游用 keep-alive，少一次 TCP 握手（探针与 Agent 都是并发短请求）。
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # request_id 由平台生成，但客户端自带的那个要原样传下去（阶段 5 的契约）。
        proxy_set_header X-Request-ID $http_x_request_id;

        # 连接/读取超时都收紧：宁可快速换一个副本，也不要把请求挂在一个正在退出的容器上。
        proxy_connect_timeout 2s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        # 副本正在退出时：连不上 / 超时 / 502·503·504 都换一个副本重试。
        # non_idempotent 让 POST /v1/tools/execute 也能重试——当前工具全是只读查询，重试安全；
        # 将来加写型工具必须先有幂等键（见 docs/stages/stage-8.md 已知限制）。
        proxy_next_upstream error timeout http_502 http_503 http_504 non_idempotent;
        proxy_next_upstream_tries 3;
        proxy_next_upstream_timeout 10s;
    }

    # 网关自身的健康（不经过上游）：容器健康门与运维探针用得上。
    location = /gateway-health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
