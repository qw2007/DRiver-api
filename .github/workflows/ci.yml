name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    # 包声明 supports >=3.11，但本机只有 3.14——不把低版本放进 CI，「兼容」就只是一句话。
    # 3.14 之外的两个版本只跑测试：静态检查与覆盖率门禁跑一遍就够，重复三遍只是浪费额度。
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.14"]
    # PostgreSQL 插件的集成测试要一个真库：没有它，tests/test_postgres_plugin.py 会整体 skip，
    # 覆盖率也会掉一截（postgres.py 只覆盖到「配置校验」那一层）。
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: demo
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: shop
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U demo -d shop"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DRIVER_TEST_POSTGRES_DSN: postgresql://demo:secret@127.0.0.1:5432/shop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      - name: 静态检查（只在主版本上跑）
        if: matrix.python-version == '3.14'
        run: |
          ruff check .
          ruff format --check src tests deploy examples
          mypy
      # 覆盖率门禁：本地长期 95%，卡 90% 是「别一路掉下去」的底线，不是精确阈值。
      - name: 测试与覆盖率门禁
        if: matrix.python-version == '3.14'
        run: pytest --cov=driver_platform --cov-report=term-missing:skip-covered --cov-fail-under=90
      - name: 测试（兼容性矩阵）
        if: matrix.python-version != '3.14'
        run: pytest -q
      # 安全扫描：这两条以前只在开发机上手动跑过，接进 CI 才有回归价值。
      - name: 安全扫描
        if: matrix.python-version == '3.14'
        run: |
          bandit -r src -q
          python -m pip_audit --progress-spinner off

  # 阶段 7：部署交付的 CI 部分。先静态校验部署描述，再把镜像真的建起来跑一次冒烟——
  # 「compose 能起」不能只在开发机上验证过一次就算数。
  # 这里只起 driver-platform：拉 Prometheus / Grafana 两个第三方镜像（1.94 GB）对冒烟没有增益。
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 校验 compose 与 provisioning 描述
        run: docker compose config --quiet

      # 阶段 8：多副本形态的**静态**校验。真滚动（起 3 副本、逐个替换、探针零失败）留在
      # deploy/rollout.py 由本机跑——把 nginx + 多副本 + 45 秒探针搬进 CI 对冒烟没有增益，
      # 只会让每次 push 多等两分钟。这里只保证「配置写得能被解析」与「脚本语法没坏」。
      - name: 校验多副本 overlay、网关配置与验收脚本
        run: |
          docker compose -f docker-compose.yml -f docker-compose.scale.yml config --quiet
          docker run --rm \
            -v "$PWD/deploy/nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro" \
            nginx@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10 \
            nginx -t
          python -m py_compile deploy/traffic_probe.py deploy/rollout.py

      - name: 构建镜像
        run: docker compose build driver-platform

      - name: 起服务
        run: docker compose up -d --no-deps driver-platform

      - name: 等健康检查通过
        run: |
          container="$(docker compose ps -q driver-platform)"
          for _ in $(seq 1 30); do
            status="$(docker inspect --format '{{.State.Health.Status}}' "$container")"
            echo "health=$status"
            if [ "$status" = "healthy" ]; then exit 0; fi
            sleep 2
          done
          docker compose logs driver-platform
          exit 1

      - name: 冒烟：/health 与 /metrics
        run: |
          curl -fsS http://localhost:8000/health
          curl -fsS http://localhost:8000/metrics | grep -q 'driver_http_requests_total'

      - name: 冒烟：按演示库调用 search_database
        run: |
          curl -fsS -X POST http://localhost:8000/v1/tools/execute \
            -H 'Content-Type: application/json' \
            -H 'X-API-Key: read-key' \
            -d '{"tool":"search_database","arguments":{"table":"customers","filters":{"city":"上海"},"limit":2}}'

      - name: 收尾
        if: always()
        run: docker compose down -v

  # 镜像发布：本机 token 没有 write:packages（实测 push 报
  # permission_denied: The token provided does not match expected scopes），所以推送放进 CI——
  # Actions 自带的 GITHUB_TOKEN 在显式给 packages: write 权限时可以推 GHCR。
  # 只在 master 上推；tag 用包版本 + 提交 sha 两个，集群清单（deploy/k8s）用版本号那个。
  publish:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: 读包版本
        id: version
        run: echo "value=$(grep -oP '(?<=__version__ = ")[^"]+' src/driver_platform/__init__.py)" >> "$GITHUB_OUTPUT"

      - name: 登录 GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: 构建并推送
        run: |
          image="ghcr.io/${{ github.repository_owner }}/driver-platform"
          docker build --build-arg DRIVER_BUILD_STAMP="${{ github.sha }}" \
            -t "$image:${{ steps.version.outputs.value }}" \
            -t "$image:sha-${GITHUB_SHA::7}" .
          docker push "$image:${{ steps.version.outputs.value }}"
          docker push "$image:sha-${GITHUB_SHA::7}"