[project]
name = "driver-platform"
version = "0.1.0"
description = "AI Agent 与数据库等工具之间的中间层驱动平台"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    # 阶段 5 可观测性：/metrics 暴露 Prometheus 指标（特性开关默认关）。
    "prometheus-client>=0.21",
    # 阶段 6 远程插件：平台侧访问远端 HTTP 服务。它本来就是 Starlette TestClient 的依赖，
    # 自己用 urllib + 线程重写一遍超时/连接/错误处理不值得。
    "httpx>=0.27",
]

[project.optional-dependencies]
# MCP 适配器可选：核心服务（HTTP / 工具 / 插件）不需要它，不装也能跑，
# 装了就多一个 stdio MCP 入口（python -m driver_platform.protocols.mcp_server）。
images = [
    # 截图入库时压成 WebP 并限制长边（没装就原样存，功能不因此失效）。
    "pillow>=10",
]
postgres = [
    # PostgreSQL 插件可选：核心服务不需要它，装了就多一个 search_postgres 工具。
    "psycopg[binary]>=3.2",
]
mcp = [
    "mcp>=1.20,<2",
]
dev = [
    "pytest>=8",
    "pytest-cov>=6",  # 覆盖率统计（阶段 5 起纳入门禁）
    "ruff>=0.6",
    "mypy>=1.11",
    "bandit>=1.7",  # 安全静态扫描（权限/鉴权代码回归）
    "pip-audit>=2.7",  # 依赖漏洞审计（阶段 8 供应链加固）
    "PyYAML>=6",  # 阶段 7：测试要解析 docker-compose.yml 与 Grafana provisioning
    "mcp>=1.20,<2",  # 测试用官方客户端做协议一致性验证
    "psycopg[binary]>=3.2",  # 测试用：PostgreSQL 插件的真实驱动
    "pillow>=10",  # 测试用：截图归一化（WebP + 长边限制）
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/driver_platform"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests", "deploy"]

[tool.mypy]
python_version = "3.11"
files = ["src", "deploy", "examples"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
strict_equality = true

