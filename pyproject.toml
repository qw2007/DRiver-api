[project]
name = "driver-platform"
version = "0.0.0"
description = "AI Agent 与数据库等工具之间的中间层驱动平台"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
# MCP 适配器可选：核心服务（HTTP / 工具 / 插件）不需要它，不装也能跑，
# 装了就多一个 stdio MCP 入口（python -m driver_platform.protocols.mcp_server）。
mcp = [
    "mcp>=1.20,<2",
]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
    "mcp>=1.20,<2",  # 测试用官方客户端做协议一致性验证
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/driver_platform"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
strict_equality = true
